<!-- upload_success.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Upload Success</title>
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.0/dist/assets/bpmn-js.css">

    <!-- viewer distro (with pan and zoom) -->
    <script src="https://unpkg.com/bpmn-js@17.0.0/dist/bpmn-navigated-viewer.development.js"></script>

    <!-- needed for this example only -->
    <script src="https://unpkg.com/jquery@3.3.1/dist/jquery.js"></script>

</head>
<body>
    <h1>Upload Successful</h1>
    <div id="canvas" style="height: 600px;"></div>
    <!-- Include your JavaScript function -->
    <script src="https://unpkg.com/bpmn-js/dist/bpmn-viewer.development.js"></script>
    
    <div id="canvas"></div>

    <script>

      var diagramUrl = 'http://127.0.0.1:8000/media/diagram.bpmn';

      // viewer instance
      var bpmnViewer = new BpmnJS({
        container: '#canvas'
      });
      async function openDiagram(bpmnXML) {

        // import diagram
        try {

          await bpmnViewer.importXML(bpmnXML);
          var canvas = bpmnViewer.get('canvas');
          var overlays = bpmnViewer.get('overlays');
          canvas.zoom('fit-viewport');
          overlays.add('SCAN_OK', 'note', {
            position: {
              bottom: 0,
              right: 0
            },
            html: '<div class="diagram-note">Mixed up the labels?</div>'
          });
          canvas.addMarker('SCAN_OK', 'needs-discussion');
        } catch (err) {

          console.error('could not import BPMN 2.0 diagram', err);
        }
      }
      $.get(diagramUrl, openDiagram, 'text');
    </script>
   
     
</body>
</html>
